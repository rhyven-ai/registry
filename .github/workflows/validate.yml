name: Registry validation
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted base code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Fetch pinned validator
        run: |
          mkdir validator
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/rhyven-ai/rhyven/releases/download/v0.4.0-rc.9/rhyven-linux-x86_64 --output validator/rhyven-linux-x86_64
          echo 'f4e812171ce51f9665595a935161b8687d4dfbb1d6094dc388fd6758f16e8756  validator/rhyven-linux-x86_64' | sha256sum --check --strict
          chmod +x validator/rhyven-linux-x86_64
      - name: Check ownership rules
        run: python3 scripts/test_authorization.py
      - name: Validate submitted index and app packages
        run: python3 scripts/validate.py
